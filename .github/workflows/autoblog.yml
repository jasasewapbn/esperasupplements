name: Autoblog Ternak (DeepSeek + Unsplash)

on:
  schedule:
    # Tiap 3 jam: 00, 03, 06, 09, 12, 15, 18, 21 UTC (~8 artikel/hari)
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      judul:
        description: "Judul manual (kosongkan = ambil antrean teratas)"
        required: false
        default: ""
      kategori:
        description: "Kategori (Ayam/Kambing/Sapi/Ikan/Pakan/Bisnis)"
        required: false
        default: ""

jobs:
  tulis:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Tulis 1 artikel (DeepSeek + Unsplash)
        run: python3 scripts/autoblog.py --judul "$JUDUL" --kategori "$KATEGORI"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          JUDUL: ${{ inputs.judul }}
          KATEGORI: ${{ inputs.kategori }}

      - name: Commit dan push
        run: |
          git config user.name "autoblog" && git config user.email "autoblog@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "Autoblog: artikel baru" && git push)
